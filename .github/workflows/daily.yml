name: Daily Diamond build

# v6.2 schedule notes (cron is UTC; ET shown for sanity):
#  - Minutes are deliberately OFF the hour and off :00/:15/:30/:45. GitHub's
#    shared scheduler queues heaviest at round times; the old ':00'/':25' crons
#    landed 4+ hours late, so every closer snap ran AFTER first pitch and kept
#    nothing. That is the direct cause of the missing 07-17/07-18 CLV data.
#  - Snaps are now DENSE rather than precise. grade.py keeps, per game, the last
#    snapshot taken before that game's own start, so more snaps only ever help.
on:
  schedule:
    # v6.7: ALL credit-spending GitHub crons are removed.
    #
    # cron-job.org is now the sole trigger for build/snap/grade, and it fires on
    # time. The old entries here duplicated it within two minutes (11:05 vs
    # 11:07, 17:35 vs 17:37, 18:35 vs 18:23, 21:35 vs 21:23) while ALSO firing
    # hours late at random. Four of them spent odds credits: 8 wasted per day,
    # ~248/month against a 500 free tier. Over half the budget, for duplicate
    # data.
    #
    # What remains is a watchdog. It spends ZERO credits and only asks "has the
    # card gone stale?", so GitHub delivering it three hours late is harmless --
    # which is exactly the kind of job this scheduler is fit for.
    - cron: '43 16 * * *'     # 12:43 PM ET  watchdog: is the card fresh?

  # External trigger. POST to the dispatches endpoint with event_type:
  #   snap  -> closer snapshot      build -> rebuild card      grade -> grade yesterday
  repository_dispatch:
    types: [snap, build, grade]
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: build
        type: choice
        options:
          - build
          - snap
          - grade

permissions:
  contents: write
  issues: write

# Split the concurrency group per schedule. The old single group meant a delayed
# build run BLOCKED the snap run queued behind it. Push races are handled by the
# rebase-retry loop in Publish instead.
#
# v7.2 (Y-A): github.event.schedule is EMPTY for repository_dispatch, which is
# now the sole trigger for build/snap/grade. The old expression therefore fell
# through to format('manual-{0}', run_id) -- a unique value per run -- so the
# group serialized nothing for 100% of real traffic. Two snap runs could hold
# credit_ledger.json open at once; budget.record() is load-modify-save with no
# lock, so an overlap silently loses a spend increment and under-enforces the
# daily and pace guards. github.event.action carries the dispatch event type.
concurrency:
  group: daily-diamond-${{ github.event.action || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # v8.1: a HUNG run is the same silent-loss shape as a failed one -- it never
    # reaches Publish, so that morning's shadow rows are discarded exactly as if
    # it had crashed, except nothing goes red for up to 6 HOURS (GitHub's
    # default) and Alert-on-failure stays quiet the whole time.
    #
    # 20 is derived from the retry budget, not guessed. The slow path is the
    # build's stats pull: model.pull_snapshot() makes 8 fg_client.leaders()
    # calls, each 3 attempts x 3 impersonation profiles x a 30s timeout plus
    # 1.5/3/4.5s backoff = 279s worst case per call. A TOTAL Cloudflare block
    # therefore raises on the FIRST endpoint at ~4.7 min and the build fails
    # fast; realistic degradation (one timed-out attempt per call) is ~5 min for
    # all 8. Grade and snap runs make no FG calls at all and finish far sooner.
    # 20 clears the realistic degraded case ~4x over. The only case it truncates
    # is 8 consecutive near-misses (~37 min), which is a broken run anyway.
    #
    # Erring long is deliberate: killing a slow grade run destroys the same
    # LAMBDA rows this is meant to protect, so the cost of a tight bound is
    # higher than the cost of a loose one.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        env:
          SCHED: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.mode }}
          DISPATCH: ${{ github.event.action }}
        run: |
          # v6.5: repository_dispatch wins. github.event.action carries the
          # event_type sent by the external scheduler (snap|build|grade).
          if [ -n "${DISPATCH:-}" ]; then
            case "$DISPATCH" in
              snap|build|grade) M="$DISPATCH" ;;
              *) echo "::error::unknown dispatch type '$DISPATCH'"; exit 1 ;;
            esac
          else
            case "$SCHED" in
              "43 16 * * *")              M=watchdog ;;
              "")                         M="${MANUAL:-build}" ;;
              *)                          M=watchdog ;;   # v6.7: an unrecognised
                                                          # cron must never spend
                                                          # credits by default
            esac
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $M (schedule='$SCHED' dispatch='${DISPATCH:-}')"

      - name: Build card
        if: steps.mode.outputs.mode == 'build'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE=$(TZ=America/New_York date +%F)
          python run_daily.py "$DATE"
          python stats.py
          python render.py "$DATE"
          test -s "daily_diamond_${DATE}.html"
          cp "daily_diamond_${DATE}.html" docs/index.html
          mkdir -p docs/archive
          cp "daily_diamond_${DATE}.html" "docs/archive/${DATE}.html"
          # v6.3: merge-fill, never cp. The evening rebuild only contains pregame
          # games; a cp would erase the afternoon picks the grade job needs.
          python archive_picks.py "$DATE"
          test -s "picktime_odds_${DATE}.json" || { echo "::error::picktime_odds_${DATE}.json missing - CLV baseline not frozen"; exit 1; }
          python -c "import json,sys; print('[clv] baseline games frozen:', len(json.load(open(sys.argv[1]))))" "picktime_odds_${DATE}.json"

      - name: Snap closers (self-correcting)
        id: snap
        if: steps.mode.outputs.mode == 'snap'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          DATE=$(TZ=America/New_York date +%F)
          # snap_smart decides whether this wake-up is worth an API call and
          # writes did_snap to $GITHUB_OUTPUT. grade.snap() carries its own
          # pre-start guard and coverage assertions when a call is spent.
          python snap_smart.py "$DATE"

      - name: Grade yesterday
        if: steps.mode.outputs.mode == 'grade'
        run: |
          DATE=$(TZ=America/New_York date -d yesterday +%F)
          test -f "docs/archive/${DATE}_picks.json" || { echo "::error::no archived picks for ${DATE}"; exit 1; }
          cp "docs/archive/${DATE}_picks.json" picks.json
          if [ -f grades_archive.jsonl ]; then BEFORE=$(wc -l < grades_archive.jsonl); else BEFORE=0; fi
          python grade.py grade "$DATE" | tee "docs/archive/${DATE}_grade.txt"
          test -s "docs/archive/${DATE}_grade.txt" || { echo "::error::grade output empty for ${DATE}"; exit 1; }
          AFTER=$(wc -l < grades_archive.jsonl)
          echo "[archive] rows ${BEFORE} -> ${AFTER}"
          # v8.0 (Y-D): "passing is a position" -- a zero-pick day is a VALID
          # output, and at LAMBDA=0 it is the EXPECTED output every day. The
          # old unconditional growth assertion would exit 1 on every such day,
          # which aborts the job BEFORE the publish step and silently discards
          # that morning's shadow_archive.jsonl rows -- destroying the exact
          # dataset the LAMBDA refit needs. Growth is now required only when
          # yesterday's card carried stakeable picks and none were reported
          # DEFERRED or VOID by the grader.
          ELIG=$(python3 -c "import json;print(sum(1 for p in json.load(open('picks.json')) if p.get('units',0)>=1))")
          echo "[archive] eligible (units>=1) picks for ${DATE}: ${ELIG}"
          if [ "$AFTER" -le "$BEFORE" ] && [ "$ELIG" -gt 0 ] && ! grep -qE 'DEFERRED|VOID' "docs/archive/${DATE}_grade.txt"; then
            echo "::error::grades_archive.jsonl did not grow for ${DATE} (${ELIG} eligible picks, none deferred/void)"; exit 1
          fi
          python stats.py
          TODAY=$(TZ=America/New_York date +%F)
          if [ -f "docs/archive/${TODAY}_picks.json" ]; then
            cp "docs/archive/${TODAY}_picks.json" picks.json
            python render.py "$TODAY" && cp "daily_diamond_${TODAY}.html" docs/index.html \
              && cp "daily_diamond_${TODAY}.html" "docs/archive/${TODAY}.html"
          fi

      - name: Watchdog (zero credits)
        if: steps.mode.outputs.mode == 'watchdog'
        run: |
          # v8.1 (audit Y-C): this used to ask ONE question -- is the card fresh?
          # -- while cron-job.org is the sole trigger for build, snap AND grade.
          # A lapsed grade or snap schedule was therefore completely invisible,
          # and this repo already lost four days to exactly that shape.
          #
          # It got worse at v8.0: with LAMBDA=0 the card is zero-pick every day,
          # so a stale card and a fresh card are VISUALLY IDENTICAL. The card
          # used to prove its own liveness by changing; it does not anymore.
          # Each pipeline therefore gets its own assertion and its own distinct
          # ::error:: line -- a grade failure must never read like a build
          # failure.
          #
          # Spends ZERO credits. Reads only files committed to this repo plus
          # credit_ledger.json (read-only, for the report). No odds/stats client
          # is imported and budget.py is not called.
          DD_TODAY=$(TZ=America/New_York date +%F)
          DD_YESTERDAY=$(TZ=America/New_York date -d yesterday +%F)
          export DD_TODAY DD_YESTERDAY
          python3 - <<'PY'
          import json, os, pathlib, sys

          T = os.environ['DD_TODAY']
          Y = os.environ['DD_YESTERDAY']
          fails = []

          def fail(code, msg):
              print("::error::watchdog " + code + ": " + msg)
              fails.append(code)

          def ok(code, msg):
              print("[watchdog] " + code + " ok - " + msg)

          def read_json(p):
              try:
                  with open(p) as fh:
                      return json.load(fh)
              except Exception:
                  return None

          # ---- 1. BUILD: is the published card actually today's? -------------
          # Exact filename match on purpose: the card renders its date as
          # "July 26, 2026", NEVER as "2026-07-26", so grepping index.html for
          # the ISO date false-alarms every single day.
          card = pathlib.Path("docs/archive/%s.html" % T)
          live = pathlib.Path("docs/index.html")
          if not (card.is_file() and card.stat().st_size > 0):
              fail("BUILD", "docs/archive/%s.html is missing or empty - the build has not run today" % T)
          elif not (live.is_file() and live.read_bytes() == card.read_bytes()):
              fail("BUILD", "docs/index.html does not match docs/archive/%s.html - the published card is not today's" % T)
          else:
              ok("BUILD", "card is fresh for %s" % T)

          # ---- was there a board yesterday? ---------------------------------
          # The three checks below are only meaningful if games were played.
          # Asserting them unconditionally would fire every day of the All-Star
          # break and every day of the off-season, and a watchdog that cries
          # wolf gets muted -- which is worse than no watchdog.
          board = read_json("docs/archive/%s_picks.json" % Y)
          gpath = pathlib.Path("docs/archive/%s_grade.txt" % Y)
          gtext = gpath.read_text() if gpath.is_file() else ""

          if board is None:
              print("::warning::watchdog: no archived board for %s - yesterday's build did not "
                    "run, so GRADE/SHADOW/SNAP cannot be asserted for it. Yesterday's own "
                    "watchdog run is the record for that failure." % Y)
              n_games = 0
          else:
              n_games = len(board)

          if n_games == 0:
              print("[watchdog] %s: no board / no games - GRADE, SHADOW and SNAP checks skipped" % Y)
          else:
              print("[watchdog] %s: %d games on the archived board - asserting all three pipelines"
                    % (Y, n_games))

              # ---- 2. GRADE -------------------------------------------------
              if not (gpath.is_file() and gpath.stat().st_size > 0):
                  fail("GRADE", "docs/archive/%s_grade.txt is missing or empty - the 09:05 grade "
                                "job did not run or did not reach the publish step" % Y)
              else:
                  ok("GRADE", "docs/archive/%s_grade.txt committed" % Y)

              # ---- 3. SHADOW: the LAMBDA dataset's own heartbeat ------------
              # The check that matters most. Every published number can look
              # correct while this silently stops growing, and the rows are
              # unrecoverable once the runner is gone.
              n_rows = 0
              try:
                  with open("shadow_archive.jsonl") as fh:
                      for line in fh:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              if json.loads(line).get("date") == Y:
                                  n_rows += 1
                          except Exception:
                              continue
              except FileNotFoundError:
                  pass
              if n_rows:
                  ok("SHADOW", "%d rows dated %s in shadow_archive.jsonl" % (n_rows, Y))
              elif "no new rows to append" in gtext:
                  print("::warning::watchdog SHADOW: zero rows dated %s, but the grader itself "
                        "reported none to append (no finals, whole slate postponed, or a "
                        "deduped re-run). Not a failure." % Y)
              else:
                  fail("SHADOW", "shadow_archive.jsonl carries ZERO rows dated %s against %d games "
                                 "on the board - the LAMBDA dataset is not growing and those rows "
                                 "are unrecoverable" % (Y, n_games))

              # ---- 4. SNAP --------------------------------------------------
              closers = read_json("closers_%s.json" % Y) or {}
              state = read_json("snap_state_%s.json" % Y) or {}
              calls = state.get("calls") or 0
              if not closers and not calls:
                  fail("SNAP", "no closer prices and no snap calls recorded for %s (closers_%s.json "
                               "and snap_state_%s.json both absent or empty) - the snap sweep did "
                               "not fire and no CLV is recoverable for that date" % (Y, Y, Y))
              else:
                  ok("SNAP", "%d closers from %d snap calls for %s" % (len(closers), calls, Y))
                  # Coverage is a WARNING, never a failure. A thin day is
                  # legitimate (postponements, doubleheaders) and coverage
                  # tuning is SN-C's job, not the watchdog's.
                  if len(closers) < n_games:
                      print("::warning::watchdog SNAP: closer coverage %d/%d for %s - CLV is "
                            "unrecoverable for the games without one" % (len(closers), n_games, Y))

          # ---- credit ledger report (read-only) -----------------------------
          led = read_json("credit_ledger.json")
          if led is None:
              print("[watchdog] no credit ledger yet")
          else:
              print("[watchdog]", led.get("quota_remaining"), "credits remaining as of",
                    led.get("quota_as_of"))
              for b in (led.get("blocks") or [])[-5:]:
                  print("    veto", str(b.get("ts"))[:16], b.get("purpose"), "-", b.get("reason"))

          if fails:
              print("::error::watchdog: %d pipeline check(s) FAILED: %s" % (len(fails), ", ".join(fails)))
              sys.exit(1)
          print("[watchdog] all pipeline checks passed")
          PY

      - name: Budget report
        if: always() && steps.mode.outputs.mode != 'watchdog'
        run: python budget.py || true

      - name: Publish
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          DID="${{ steps.snap.outputs.did_snap }}"
          if [ "$MODE" = "watchdog" ]; then
            echo "[publish] watchdog mode - nothing to commit"
            exit 0
          fi
          if [ "$MODE" = "snap" ] && [ "$DID" != "true" ]; then
            echo "[publish] snap spent no call - nothing to commit, exiting clean"
            exit 0
          fi
          git config user.name "daily-diamond-bot"
          git config user.email "bot@users.noreply.github.com"
          test -f docs/index.html || { echo "::error::docs/index.html missing"; exit 1; }
          git add -f docs/index.html
          git add -f docs/archive/
          if [ -f docs/stats.json ]; then git add -f docs/stats.json; fi
          for f in picks.json model_output.json odds_map.json slate.json raw_odds_response.json grades_archive.jsonl shadow_archive.jsonl credit_ledger.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          for f in closers_*.json picktime_odds_*.json snap_state_*.json shadow_*.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          echo "--- staged ---"
          git diff --cached --name-only
          if git diff --cached --quiet; then echo "::error::nothing staged - publish would be a no-op"; exit 1; fi
          git commit -m "run $(TZ=America/New_York date '+%F %H:%M %Z') [${{ steps.mode.outputs.mode }}]"
          PUSHED=0
          for i in 1 2 3 4 5; do
            if git push; then echo "[push] ok on attempt $i"; PUSHED=1; break; fi
            echo "[push] rejected, rebasing (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((i * 5))
          done
          if [ "$PUSHED" -ne 1 ]; then echo "::error::push failed after 5 attempts"; exit 1; fi

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WHEN=$(TZ=America/New_York date '+%F %H:%M %Z')
          gh issue create --title "Daily Diamond FAILED [${{ steps.mode.outputs.mode }}] - $WHEN" --body "Run failed. mode=${{ steps.mode.outputs.mode }} schedule='${{ github.event.schedule || 'manual' }}'. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || echo "issue create failed (non-fatal)"
